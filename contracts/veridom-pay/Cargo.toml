[package]
name = "veridom-pay"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.5.0"
near-contract-standards = "=5.5.0"
serde_json = "1"
hex = "0.4"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
